  - id: T-20260910-f1-05-sysadmin-cria-praca-e-vincula-administrador
    title: "O SysAdmin cria praça e vincula Administrador com praça padrão"
    effort: L
    profile: standard
    agent: any
    execution_backend: claude
    priority: P1
    severity: security
    required_tools: [bash, git, node, npx]
    depends_on: [T-20260910-f1-03-mundo-de-exemplo-isolado, T-20260910-f1-04-ninguem-vira-administrador-sozinho]
    touches_paths: [lib/actions/admin-users.ts, lib/actions/convite.ts, lib/actions/workspace.ts, components/nav.tsx, components/criar-admin-form.tsx, lib/supabase/database.types.ts]
    creates_paths: [supabase/migrations/0041_praca_padrao_do_administrador.sql, lib/actions/pracas.ts, components/admin/pracas-forms.tsx]
    source_note: cvg/docs/tech-spec/fatia-1-seguranca.md
    why: "ADR 0013 — a praça nasce do Administrador (auto-criada, criada por ele no seletor, ou pelo convite de sócio), não existe vínculo a praça existente nem praça padrão. D-016 — só o SysAdmin cria praça e vincula Administrador."
    goal: "O SysAdmin cria praça pela área dele e vincula um Administrador a uma ou mais praças com uma padrão (R-46, R-47); convite de Administrador e criação de praça passam a ser só dele; criar ou promover Administrador deixa de fabricar uma Empresa de nome."
    done_condition: "tests/fatia1/pracas.test.ts verde, gabarito intacto, typecheck, lint e npm test verdes."
    context: "Leia: cvg/docs/tech-spec/fatia-1-seguranca.md (R-46, R-47), ADR 0013, D-010, D-016, GAP-015, e o cabeçalho de tests/fatia1/pracas.test.ts (o contrato).\n- workspace_members.padrao (booleano): no máximo uma por pessoa (índice único parcial); a migration marca a praça atual de cada Administrador e Funcionário existente.\n- lib/actions/pracas.ts (\"use server\") exporta criarPracaAction(estado, formData), com os campos nome, cidade e estado, e vincularAdministradorAction(adminId, pracaIds, padraoId). O ator vem de tryWriter() (lib/auth/guard); quem não é SysAdmin é recusado ANTES de qualquer escrita. O vínculo SUBSTITUI o conjunto e exige a padrão entre as vinculadas. Escritas com a chave de serviço (lib/supabase/admin.ts).\n- criarConviteAction(\"owner\") recusa quem não é SysAdmin antes de qualquer consulta; criarEmpresaAction e excluirEquipeAction (lib/actions/workspace.ts) deixam de valer para quem não é SysAdmin.\n- workspaces.owner_id é obrigatório hoje e significa administrador responsável (D-010): decida na migration como fica uma praça criada pelo SysAdmin antes de ter Administrador, e registre a escolha em COMMENT ON.\n- Página /admin/pracas (criar e vincular) no menu do SysAdmin (components/nav.tsx); a página cita criarPracaAction e vincularAdministradorAction, e os formulários de cliente moram em components/admin/pracas-forms.tsx. Criar Administrador escolhe a praça padrão entre as existentes.\n- Conta de exemplo (tarefa 3): criar praça e vincular também respeitam podeAgirSobre.\n\nArquivos em grupo de rota do Next, declarados no frontmatter desta spec (o TaskPlan não aceita parênteses): app/(app)/admin/usuarios/page.tsx (alterar) e app/(app)/admin/pracas/page.tsx (criar).\n\nMigration: arquivo novo supabase/migrations/0041_praca_padrao_do_administrador.sql. Mesmos comandos da tarefa 1 (nunca imprima o token):\n  export SUPABASE_ACCESS_TOKEN=$(grep '^SUPABASE_TOKEN=' .env.local | cut -d= -f2-)\n  npx supabase db push --linked --yes\n  (para reaplicar a SUA 0041: migration repair --status reverted 0041 --linked, depois db push)\n  npx supabase gen types typescript --linked > lib/supabase/database.types.ts\nNunca edite migration de outra tarefa. COMMENT ON na coluna e no índice novos."
    do_not_touch: [tests/fatia1, vitest.gabarito.config.ts, .cvg, cvg/docs, cvg/brain, .env.local]
    anti_patterns:
      - "Checar o papel depois de escrever."
      - "Apagar praça ou vínculo com histórico — a regra é nunca deletar (ROADMAP seção 3)."
      - "Usar a sessão por cookie nas actions novas — o contrato é tryWriter mais chave de serviço."
    rollback: "Migration nova que remove workspace_members.padrao; remover a página e as actions."
    observability: "(none)"
    behaviors:
      - id: B-1
        given: "os Administradores já existentes"
        when: "a migration roda"
        then: "cada um tem exatamente uma praça padrão"
      - id: B-2
        given: "um ator que não é SysAdmin"
        when: "tenta criar praça, vincular Administrador ou gerar convite de Administrador"
        then: "é recusado e nada é escrito"
      - id: B-3
        given: "o SysAdmin"
        when: "cria duas praças e vincula um Administrador a elas, depois a uma só, e tenta uma padrão fora do conjunto"
        then: "as praças existem, o vínculo reflete exatamente o último conjunto com uma única padrão, e a padrão fora do conjunto é recusada"
      - id: B-4
        given: "a interface do SysAdmin"
        when: "a tarefa termina"
        then: "existe /admin/pracas no menu dele, usando as duas actions, e não se fabrica mais Empresa de nome"
      - id: B-5
        given: "o resto do app"
        when: "a tarefa termina"
        then: "typecheck, lint e testes unitários seguem verdes e o gabarito está intacto"
    evals:
