  - id: T-20260910-f1-01-servico-nasce-e-muda-pelo-fluxo
    title: "O serviço só nasce e só muda pelo fluxo — regra no banco"
    effort: M
    profile: standard
    agent: any
    execution_backend: claude
    priority: P0
    severity: security
    required_tools: [bash, git, node, npx]
    depends_on: []
    touches_paths: [lib/actions/agenda-v2.ts, lib/supabase/database.types.ts]
    creates_paths: [supabase/migrations/0038_servico_nasce_e_muda_pelo_fluxo.sql]
    source_note: cvg/docs/tech-spec/fatia-1-seguranca.md
    why: "ADR 0010 — o banco confere quem escreve em servicos, não a regra do agendamento; um cliente fora da aplicação cria serviço já realizado, reserva horário ocupado, inventa preço e confirma o próprio pedido (confirmado ao vivo pelo gabarito). ADR 0011 — a reserva do cliente não consegue marcar o horário."
    goal: "As regras de nascimento e de mudança de estado do serviço (R-37, R-38, R-39) passam a valer no banco para qualquer sessão autenticada, e o próprio banco marca o horário como pendente quando o serviço nasce."
    done_condition: "tests/fatia1/servicos.test.ts verde contra o banco do protótipo, gabarito intacto, typecheck, lint e npm test verdes."
    context: "Leia antes: cvg/docs/tech-spec/fatia-1-seguranca.md (R-37 a R-39), cvg/docs/adrs/0010, 0011 e 0017, e o cabeçalho de tests/fatia1/servicos.test.ts — ele é o contrato.\n- Nascimento: só o cliente dono insere; estado inicial pendente; horário livre e do prestador indicado; preco_tipo e preco_valor iguais aos do perfil do prestador.\n- Transições: pendente para confirmado só pelo prestador; confirmado para realizado só pelo prestador; pendente ou confirmado para cancelado por qualquer das partes, com motivo não vazio depois de trim; realizado e cancelado são finais.\n- O banco marca agenda_slots como pendente quando o serviço nasce. A sessão do cliente não tem, e não deve ganhar, permissão de atualizar agenda_slots.\n- A chave de serviço (service_role, usada por scripts de seed e código de servidor) não é barrada.\n- A renegociação continua: o prestador grava preco_pendente e o cliente copia para preco_valor ao aceitar.\nAjuste reservarSlotAction (lib/actions/agenda-v2.ts) para não depender do update do horário pela sessão do cliente.\n\nMigration: arquivo novo supabase/migrations/0038_servico_nasce_e_muda_pelo_fluxo.sql, na sequência da 0037. Nunca edite migration de outra tarefa — corrija com uma nova. Base única do protótipo, sem staging. Comandos (nunca imprima o token):\n  export SUPABASE_ACCESS_TOKEN=$(grep '^SUPABASE_TOKEN=' .env.local | cut -d= -f2-)\n  npx supabase db push --linked --yes\n  (para reaplicar a SUA 0038 enquanto itera: escreva-a idempotente, com drop if exists e create or replace, e rode)\n  npx supabase migration repair --status reverted 0038 --linked\n  npx supabase db push --linked --yes\n  npx supabase gen types typescript --linked > lib/supabase/database.types.ts\nToda tabela, coluna e função nova ganha COMMENT ON (convenção do CLAUDE.md). Função SECURITY DEFINER fixa search_path.\nOs gabaritos de integração leem as credenciais do .env.local sozinhos (tests/setup.ts)."
    do_not_touch: [tests/fatia1, vitest.gabarito.config.ts, .cvg, cvg/docs, cvg/brain, .env.local]
    anti_patterns:
      - "Regra só em lib/actions — o gabarito ataca fora da aplicação."
      - "Barrar a service_role — quebra os scripts de seed."
      - "Travar preco_valor para o cliente — quebra a renegociação (fica para a Fatia 5)."
      - "Mexer na unicidade de slot_id ou fazer o cancelamento liberar o horário — é da Fatia 4 (ADR 0017)."
      - "Reaplicar a migration editada sem migration repair."
      - "Dar à sessão do cliente permissão de atualizar agenda_slots."
    rollback: "Uma migration nova que remove os gatilhos e funções da 0038 e restaura as políticas de servicos da 0024."
    observability: "(none)"
    behaviors:
      - id: B-1
        given: "um cliente autenticado falando direto com o banco"
        when: "tenta criar serviço já realizado ou confirmado, em horário ocupado, com prestador que não é o dono do horário, ou com valor ou tipo de preço diferentes do perfil"
        then: "o banco recusa, nenhum serviço nasce e o contador público do prestador não se move"
      - id: B-2
        given: "um horário livre de um prestador"
        when: "o cliente insere o próprio serviço com os dados do perfil do prestador"
        then: "o serviço nasce pendente e o horário passa a pendente"
      - id: B-3
        given: "um serviço pendente, confirmado, realizado ou cancelado"
        when: "o cliente tenta confirmar ou realizar, alguém cancela sem motivo, ou alguém muda um realizado ou cancelado"
        then: "o estado não muda — e o prestador confirma, marca realizado (contador +1) e a renegociação segue funcionando"
      - id: B-4
        given: "o resto do app"
        when: "a tarefa termina"
        then: "typecheck, lint e testes unitários seguem verdes e o gabarito está intacto"
    evals:
      - id: eval_1
        description: "Gabarito da tarefa 1 contra o banco do protótipo"
        command: npx vitest run --config vitest.gabarito.config.ts tests/fatia1/servicos.test.ts
        verifies: [B-1, B-2, B-3]
        expected_duration_sec: 120
      - id: eval_2
        description: "O gabarito não foi editado nem ganhou arquivo"
        command: git diff --quiet f251e2c -- tests/fatia1 vitest.gabarito.config.ts && test -z "$(git status --porcelain -- tests/fatia1 vitest.gabarito.config.ts)"
        verifies: [B-4]
        expected_duration_sec: 2
      - id: eval_3
        description: "Typecheck verde"
        command: npm run typecheck
        verifies: [B-4]
        expected_duration_sec: 60
      - id: eval_4
        description: "Lint verde"
        command: npm run lint
        verifies: [B-4]
        expected_duration_sec: 60
      - id: eval_5
        description: "Suíte unitária verde"
        command: npm test
        verifies: [B-4]
        expected_duration_sec: 60

  - id: T-20260910-f1-02-contato-e-endereco-entre-as-partes
    title: "Contato, chave e endereço só entre as partes de um serviço válido"
    effort: M
    profile: standard
    agent: any
    execution_backend: claude
    priority: P0
    severity: security
    required_tools: [bash, git, node, npx]
    depends_on: [T-20260910-f1-01-servico-nasce-e-muda-pelo-fluxo]
    touches_paths: [lib/actions/auth.ts, lib/supabase/database.types.ts]
    creates_paths: [supabase/migrations/0039_contato_e_endereco_entre_as_partes.sql]
    source_note: cvg/docs/tech-spec/fatia-1-seguranca.md
    why: "ADR 0010 — tem_servico_com libera contato e ponto exato em qualquer status, inclusive cancelado. ADR 0015 — o endereço escrito mora em profiles, tabela que qualquer autenticado lê."
    goal: "Contato, chave de recebimento e ponto exato abrem só com serviço pendente, confirmado ou realizado (R-40, D-017); o endereço escrito sai de profiles e passa a morar em profile_local.endereco, sob a mesma regra (R-41), e o cadastro grava lá."
    done_condition: "tests/fatia1/contato.test.ts verde, gabarito intacto, typecheck, lint e npm test verdes."
    context: "Leia: cvg/docs/tech-spec/fatia-1-seguranca.md (R-40, R-41), ADRs 0010 e 0015, e o cabeçalho de tests/fatia1/contato.test.ts (o contrato). profiles.endereco tem 0 linhas preenchidas (ADR 0015) e ninguém a lê — só o cadastro (cadastrarAction em lib/actions/auth.ts) grava. O endereço de um SERVIÇO (servicos.endereco) é outra coisa e não muda.\n\nMigration: arquivo novo supabase/migrations/0039_contato_e_endereco_entre_as_partes.sql. Mesmos comandos da tarefa 1 (nunca imprima o token):\n  export SUPABASE_ACCESS_TOKEN=$(grep '^SUPABASE_TOKEN=' .env.local | cut -d= -f2-)\n  npx supabase db push --linked --yes\n  (para reaplicar a SUA 0039: migration repair --status reverted 0039 --linked, depois db push)\n  npx supabase gen types typescript --linked > lib/supabase/database.types.ts\nNunca edite migration de outra tarefa. COMMENT ON na coluna nova e na função alterada."
    do_not_touch: [tests/fatia1, vitest.gabarito.config.ts, .cvg, cvg/docs, cvg/brain, .env.local]
    anti_patterns:
      - "Esconder o endereço só na tela — a leitura direta pelo banco continuaria."
      - "Mexer em servicos.endereco (endereço do serviço, não da pessoa)."
      - "Mudar a leitura global de profiles como um todo — é da Fatia 5 (W-4)."
    rollback: "Migration nova que devolve profiles.endereco e restaura tem_servico_com da 0027."
    observability: "(none)"
    behaviors:
      - id: B-1
        given: "um cliente e um prestador com um único serviço entre eles"
        when: "o serviço está pendente, confirmado ou realizado — e depois cancelado"
        then: "cada um lê o contato e o ponto exato do outro nos três primeiros estados, e ninguém lê nada com o serviço cancelado"
      - id: B-2
        given: "o endereço escrito de uma pessoa"
        when: "um estranho, a outra parte de um serviço válido e a própria pessoa tentam lê-lo"
        then: "ele não existe mais em profiles, mora em profile_local.endereco, o estranho lê 0 e as outras duas leem"
      - id: B-3
        given: "o resto do app"
        when: "a tarefa termina"
        then: "typecheck, lint e testes unitários seguem verdes e o gabarito está intacto"
    evals:
      - id: eval_1
        description: "Gabarito da tarefa 2 contra o banco do protótipo"
        command: npx vitest run --config vitest.gabarito.config.ts tests/fatia1/contato.test.ts
        verifies: [B-1, B-2]
        expected_duration_sec: 120
      - id: eval_2
        description: "O gabarito não foi editado nem ganhou arquivo"
        command: git diff --quiet f251e2c -- tests/fatia1 vitest.gabarito.config.ts && test -z "$(git status --porcelain -- tests/fatia1 vitest.gabarito.config.ts)"
        verifies: [B-3]
        expected_duration_sec: 2
      - id: eval_3
        description: "Typecheck verde"
        command: npm run typecheck
        verifies: [B-3]
        expected_duration_sec: 60
      - id: eval_4
        description: "Lint verde"
        command: npm run lint
        verifies: [B-3]
        expected_duration_sec: 60
      - id: eval_5
        description: "Suíte unitária verde"
        command: npm test
        verifies: [B-3]
        expected_duration_sec: 60

  - id: T-20260910-f1-03-mundo-de-exemplo-isolado
    title: "Contas de exemplo presas ao mundo de exemplo"
    effort: L
    profile: standard
    agent: any
    execution_backend: claude
    priority: P0
    severity: security
    required_tools: [bash, git, node, npx]
    depends_on: [T-20260910-f1-02-contato-e-endereco-entre-as-partes]
    touches_paths: [lib/auth/contas-exemplo.ts, lib/auth/roles.ts, lib/actions/admin-users.ts, lib/supabase/database.types.ts]
    creates_paths: [supabase/migrations/0040_marca_do_mundo_de_exemplo.sql, lib/auth/exemplo.ts, lib/admin/consultas.ts]
    source_note: cvg/docs/tech-spec/fatia-1-seguranca.md
    why: "ADR 0012 — as contas de exemplo são contas reais sem marca própria, e a conta de exemplo SysAdmin, de um clique na landing, lê e altera os dados de todo mundo. O dono manteve as cinco contas (D-015); o risco fecha por isolamento."
    goal: "Uma conta de exemplo, de qualquer papel, só enxerga e altera o mundo de exemplo (R-42), e a senha das contas de exemplo só existe no servidor (R-43)."
    done_condition: "tests/fatia1/exemplo.test.ts verde, gabarito intacto, typecheck, lint e npm test verdes."
    context: "Leia: cvg/docs/tech-spec/fatia-1-seguranca.md (R-42, R-43), ADR 0012, D-015, e o cabeçalho de tests/fatia1/exemplo.test.ts (o contrato).\n- profiles.exemplo (booleano, padrão falso); a migration marca exatamente as cinco contas de lib/auth/contas-exemplo.ts, casadas pelo e-mail.\n- lib/auth/exemplo.ts exporta podeAgirSobre(ator, alvo): conta de exemplo não age sobre quem não é de exemplo. O usuário corrente (lib/auth/roles.ts) passa a carregar se é de exemplo.\n- lib/admin/consultas.ts exporta listarAcessos(db, ator), listarServicosDaPlataforma(db, ator) e listarUsuarios(db, ator): com ator de exemplo, só o mundo de exemplo. As páginas /admin/logs (as duas abas), /admin/servicos e /admin/usuarios passam a usar essas funções.\n- definirPapelAction consulta podeAgirSobre sobre o alvo; criarAdminAction recusa ator de exemplo (criaria uma conta real).\n- lib/auth/contas-exemplo.ts ganha import server-only (o vitest já tem stub para ele).\nOs cinco botões da landing continuam entrando (a regressão da tarefa 11 confere); a rota app/api/exemplo fica como está.\n\nArquivos em grupo de rota do Next, declarados no frontmatter desta spec (o TaskPlan não aceita parênteses): app/(app)/admin/logs/page.tsx, app/(app)/admin/servicos/page.tsx, app/(app)/admin/usuarios/page.tsx.\n\nMigration: arquivo novo supabase/migrations/0040_marca_do_mundo_de_exemplo.sql. Mesmos comandos da tarefa 1 (nunca imprima o token):\n  export SUPABASE_ACCESS_TOKEN=$(grep '^SUPABASE_TOKEN=' .env.local | cut -d= -f2-)\n  npx supabase db push --linked --yes\n  (para reaplicar a SUA 0040: migration repair --status reverted 0040 --linked, depois db push)\n  npx supabase gen types typescript --linked > lib/supabase/database.types.ts\nNunca edite migration de outra tarefa. COMMENT ON na coluna nova."
    do_not_touch: [tests/fatia1, vitest.gabarito.config.ts, app/api/exemplo, .cvg, cvg/docs, cvg/brain, .env.local]
    anti_patterns:
      - "Remover as contas de exemplo ou os botões da landing — o dono decidiu mantê-los (D-015)."
      - "Reconhecer conta de exemplo pelo domínio do e-mail em tempo de consulta, espalhado pelo código — a marca mora no banco e a regra num lugar só."
      - "Filtrar só na tela sem que a função de consulta imponha o escopo."
    rollback: "Migration nova que remove profiles.exemplo; as páginas voltam a ler sem escopo."
    observability: "(none)"
    behaviors:
      - id: B-1
        given: "a base do protótipo"
        when: "se consulta quem carrega a marca de exemplo, e se cria uma pessoa nova"
        then: "exatamente as cinco contas de exemplo carregam a marca, e a pessoa nova nasce sem ela"
      - id: B-2
        given: "uma pessoa que não é de exemplo, com acesso registrado e serviço"
        when: "as consultas administrativas rodam com um ator de exemplo e com um ator real"
        then: "o ator de exemplo não a vê em acessos, serviços nem usuários; o ator real vê"
      - id: B-3
        given: "a regra única de escrita administrativa"
        when: "um ator de exemplo tenta agir sobre quem não é de exemplo"
        then: "podeAgirSobre recusa, a action de mudar papel a consulta, e a senha das contas de exemplo fica só no servidor"
      - id: B-4
        given: "o resto do app"
        when: "a tarefa termina"
        then: "typecheck, lint e testes unitários seguem verdes e o gabarito está intacto"
    evals:
      - id: eval_1
        description: "Gabarito da tarefa 3 (regra pura, uso nas telas e contra o banco)"
        command: npx vitest run --config vitest.gabarito.config.ts tests/fatia1/exemplo.test.ts
        verifies: [B-1, B-2, B-3]
        expected_duration_sec: 120
      - id: eval_2
        description: "O gabarito não foi editado nem ganhou arquivo"
        command: git diff --quiet f251e2c -- tests/fatia1 vitest.gabarito.config.ts && test -z "$(git status --porcelain -- tests/fatia1 vitest.gabarito.config.ts)"
        verifies: [B-4]
        expected_duration_sec: 2
      - id: eval_3
        description: "Typecheck verde"
        command: npm run typecheck
        verifies: [B-4]
        expected_duration_sec: 60
      - id: eval_4
        description: "Lint verde"
        command: npm run lint
        verifies: [B-4]
        expected_duration_sec: 60
      - id: eval_5
        description: "Suíte unitária verde"
        command: npm test
        verifies: [B-4]
        expected_duration_sec: 60

  - id: T-20260910-f1-04-ninguem-vira-administrador-sozinho
    title: "Ninguém se torna Administrador por conta própria"
    effort: M
    profile: standard
    agent: any
    execution_backend: claude
    priority: P0
    severity: security
    required_tools: [bash, git, node, npx]
    depends_on: [T-20260910-f1-02-contato-e-endereco-entre-as-partes]
    touches_paths: [lib/actions/auth.ts, components/trocar-papel.tsx]
    creates_paths: [lib/auth/papeis.ts]
    source_note: cvg/docs/tech-spec/fatia-1-seguranca.md
    why: "ADR 0013 — o cadastro público aceita tipo_base admin (lib/validation.ts) e a troca de papel leva prestador a Administrador, então qualquer pessoa vira Administrador. D-016 — na v2, Administrador nasce só por ação do SysAdmin."
    goal: "O cadastro público oferece só Cliente e Prestador de Serviço, a troca de papel nunca leva a Administrador, e os dois usam uma regra única em lib/auth/papeis.ts (R-44)."
    done_condition: "tests/fatia1/papeis.test.ts verde, gabarito intacto, typecheck, lint e npm test verdes."
    context: "Leia: cvg/docs/tech-spec/fatia-1-seguranca.md (R-44), ADR 0013, D-016, e o cabeçalho de tests/fatia1/papeis.test.ts (o contrato: PAPEIS_DO_CADASTRO_PUBLICO, papelPermitidoNoCadastro(tipo, temConvite) e podeTrocarPara(atual, novo) em lib/auth/papeis.ts). Depende da tarefa 2 porque as duas mexem em lib/actions/auth.ts. O cadastro por convite continua valendo o papel do convite. Administradores existentes não perdem acesso. O componente de troca de papel decide sozinho não aparecer quando não houver destino permitido — a página do perfil fica fora do escopo.\n\nArquivo em grupo de rota do Next, declarado no frontmatter desta spec (o TaskPlan não aceita parênteses): app/(auth)/cadastro/form.tsx."
    do_not_touch: [tests/fatia1, vitest.gabarito.config.ts, supabase/migrations, .cvg, cvg/docs, cvg/brain, .env.local]
    anti_patterns:
      - "Esconder a opção só na tela, deixando a action aceitar admin."
      - "Quebrar o cadastro por convite."
    rollback: "Reverter o commit da tarefa."
    observability: "(none)"
    behaviors:
      - id: B-1
        given: "a regra única de papéis"
        when: "se pergunta que papéis o cadastro público e a troca de papel aceitam"
        then: "sem convite só Cliente e Prestador passam, papel desconhecido nunca passa, com convite vale o papel do convite, e a troca nunca leva a Administrador"
      - id: B-2
        given: "a tela de cadastro e as actions de cadastro e troca"
        when: "a tarefa termina"
        then: "a tela não oferece a opção de empresa e as duas actions usam a regra única"
      - id: B-3
        given: "o resto do app"
        when: "a tarefa termina"
        then: "typecheck, lint e testes unitários seguem verdes e o gabarito está intacto"
    evals:
      - id: eval_1
        description: "Gabarito da tarefa 4"
        command: npx vitest run --config vitest.gabarito.config.ts tests/fatia1/papeis.test.ts
        verifies: [B-1, B-2]
        expected_duration_sec: 30
      - id: eval_2
        description: "O gabarito não foi editado nem ganhou arquivo"
        command: git diff --quiet f251e2c -- tests/fatia1 vitest.gabarito.config.ts && test -z "$(git status --porcelain -- tests/fatia1 vitest.gabarito.config.ts)"
        verifies: [B-3]
        expected_duration_sec: 2
      - id: eval_3
        description: "Typecheck verde"
