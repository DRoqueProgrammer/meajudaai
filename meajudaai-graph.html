<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeAjuda Aí — Mapa da Arquitetura</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --panel-2:#eef1f7; --ink:#1a2230; --ink-soft:#5b6472;
  --line:#dfe3ec; --accent:#0d47a1; --accent-soft:#e6eefb; --canvas:#eef1f7; --canvasgrid:#e2e7f0;
  --chip:#eef1f7; --shadow:0 6px 24px rgba(20,32,64,.10);
  --l-banco:#e8635a; --l-doc:#8a8f98; --l-cfg:#b08968; --l-test:#43a047; --l-api:#f2a93b;
  --l-rotas:#1f6fe0; --l-ui:#7c5cff; --l-auth:#e0457b; --l-actions:#12a5a5; --l-dominio:#c9a227;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f19; --panel:#131926; --panel-2:#1b2333; --ink:#e8ecf4; --ink-soft:#9aa4b6;
  --line:#232c3d; --accent:#5b8def; --accent-soft:#17233c; --canvas:#0e1420; --canvasgrid:#182034;
  --chip:#1b2333; --shadow:0 8px 30px rgba(0,0,0,.45);
}}
:root[data-theme="light"]{
  --bg:#f6f7fb; --panel:#ffffff; --panel-2:#eef1f7; --ink:#1a2230; --ink-soft:#5b6472;
  --line:#dfe3ec; --accent:#0d47a1; --accent-soft:#e6eefb; --canvas:#eef1f7; --canvasgrid:#e2e7f0;
  --chip:#eef1f7; --shadow:0 6px 24px rgba(20,32,64,.10);
}
:root[data-theme="dark"]{
  --bg:#0b0f19; --panel:#131926; --panel-2:#1b2333; --ink:#e8ecf4; --ink-soft:#9aa4b6;
  --line:#232c3d; --accent:#5b8def; --accent-soft:#17233c; --canvas:#0e1420; --canvasgrid:#182034;
  --chip:#1b2333; --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:14px; line-height:1.5; overflow:hidden;
}
.mono{font-family:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace}
.app{display:grid; grid-template-columns:308px 1fr; grid-template-rows:auto 1fr; height:100vh}
header{
  grid-column:1 / -1; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:10px}
.brand h1{margin:0; font-size:18px; font-weight:700; letter-spacing:-.02em}
.brand .dot{color:var(--accent)}
.brand p{margin:0; color:var(--ink-soft); font-size:12.5px; max-width:640px}
.stats{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}
.stat{background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:5px 11px; text-align:center; min-width:66px}
.stat b{display:block; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.stat span{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em}
aside{
  background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:16px;
  display:flex; flex-direction:column; gap:18px;
}
.sec-title{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); font-weight:700; margin:0 0 9px}
.search{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--ink); font-size:13px}
.search:focus{outline:2px solid var(--accent); outline-offset:0}
.toggles{display:flex; gap:8px}
.tg{flex:1; display:flex; align-items:center; gap:7px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); cursor:pointer; font-size:12.5px; user-select:none}
.tg input{accent-color:var(--accent); margin:0}
.legend{display:flex; flex-direction:column; gap:3px}
.lg{display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:8px; cursor:pointer; border:1px solid transparent}
.lg:hover{background:var(--panel-2)}
.lg.off{opacity:.36}
.lg.solo{border-color:var(--line); background:var(--panel-2)}
.sw{width:11px; height:11px; border-radius:3px; flex:none}
.lg .nm{flex:1; font-size:12.5px}
.lg .ct{font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.tour{display:flex; flex-direction:column; gap:5px}
.ts{padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); cursor:pointer}
.ts:hover{border-color:var(--accent)}
.ts .n{display:flex; gap:8px; align-items:baseline}
.ts .num{font-size:11px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums}
.ts .tt{font-size:12.5px; font-weight:600}
.ts .ds{font-size:11.5px; color:var(--ink-soft); margin-top:3px; display:none}
.ts.open .ds{display:block}
main{position:relative; overflow:hidden; background:var(--canvas)}
canvas{display:block; width:100%; height:100%; cursor:grab}
canvas.drag{cursor:grabbing}
.hint{position:absolute; left:14px; bottom:12px; font-size:11.5px; color:var(--ink-soft); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; pointer-events:none; opacity:.92}
.zoombar{position:absolute; right:14px; bottom:12px; display:flex; gap:6px}
.zoombar button{width:32px; height:32px; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:8px; cursor:pointer; font-size:16px; line-height:1; box-shadow:var(--shadow)}
.zoombar button:hover{border-color:var(--accent)}
.inspector{
  position:absolute; top:14px; right:14px; width:330px; max-width:calc(100% - 28px); max-height:calc(100% - 28px);
  background:var(--panel); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow);
  padding:16px; overflow-y:auto; transform:translateX(calc(100% + 22px)); transition:transform .22s ease; z-index:5;
}
.inspector.show{transform:none}
.insp-close{position:absolute; top:11px; right:12px; border:none; background:transparent; color:var(--ink-soft); font-size:20px; cursor:pointer; line-height:1}
.badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line)}
.badge .sw{width:9px;height:9px}
#insp-name{margin:6px 0 3px; font-size:16px; font-weight:700; letter-spacing:-.01em; word-break:break-word; padding-right:20px}
#insp-path{font-size:11.5px; color:var(--ink-soft); word-break:break-all; margin-bottom:11px}
#insp-summary{font-size:13px; margin:12px 0}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin:10px 0}
.tag{font-size:11px; padding:2px 8px; border-radius:6px; background:var(--accent-soft); color:var(--accent); font-weight:600}
.conn h4{margin:14px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft)}
.conn a{display:block; font-size:12px; padding:5px 8px; border-radius:7px; color:var(--ink); text-decoration:none; cursor:pointer; border:1px solid transparent}
.conn a:hover{background:var(--panel-2); border-color:var(--line)}
.conn a .tp{font-size:10px; color:var(--ink-soft)}
@media (max-width:820px){
  .app{grid-template-columns:1fr; grid-template-rows:auto auto 1fr}
  aside{max-height:230px; flex-direction:row; flex-wrap:wrap; overflow-y:auto}
  aside>div{flex:1; min-width:220px}
  .inspector{width:calc(100% - 28px)}
}
@media (prefers-reduced-motion:reduce){.inspector{transition:none}}
</style>
</head>

  </main>
</div>

<script>
const G = JSON.parse(document.getElementById('graph-data').textContent);
const LC = {
  'layer:banco-de-dados':'--l-banco','layer:documentacao':'--l-doc','layer:config-build':'--l-cfg',
  'layer:testes':'--l-test','layer:api-handlers':'--l-api','layer:rotas-telas':'--l-rotas',
  'layer:componentes-ui':'--l-ui','layer:auth-sessao':'--l-auth','layer:server-actions':'--l-actions',
  'layer:dominio-utils':'--l-dominio'
};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const layerColor = id => css(LC[id]||'--l-doc') || '#888';

// ---- adjacency
const N = G.nodes.length;
G.nodes.forEach((n,i)=>{n.i=i; n.out=[]; n.in=[];});
for(const e of G.edges){ G.nodes[e.s].out.push(e); G.nodes[e.t].in.push(e); }
const fileLevel = new Set(['file','config','document','service','pipeline','table','schema','resource','endpoint']);
G.nodes.forEach(n=> n.fl = fileLevel.has(n.t));

// ---- layout state: layer cluster centers on a ring
const layerIds = G.layers.map(l=>l.id);
const centers = {};
layerIds.forEach((id,k)=>{ const a=(k/layerIds.length)*Math.PI*2 - Math.PI/2; centers[id]={x:Math.cos(a)*430, y:Math.sin(a)*360}; });
G.nodes.forEach(n=>{
  const c = centers[n.L]||{x:0,y:0};
  n.x = c.x + (Math.random()-.5)*180; n.y = c.y + (Math.random()-.5)*180; n.vx=0; n.vy=0;
});

// ---- filters
let alpha=1; // sim temperature (declared early: recompute() below reheats it)
const show = { files:true, fns:false };
const soloLayers = new Set(); // empty => all on
let query = '';
function visible(n){
  if(n.fl && !show.files) return false;
  if(!n.fl && !show.fns) return false;
  if(soloLayers.size && !soloLayers.has(n.L)) return false;
  return true;
}
let vis = [];
function recompute(){ vis = G.nodes.filter(visible); alpha=1; }
recompute();

// ---- camera
const cam = {x:0,y:0,z:.72};
const cv = document.getElementById('cv'); const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; }
new ResizeObserver(resize).observe(cv); resize();
const toScreen = p => ({x:(p.x-cam.x)*cam.z + W/2, y:(p.y-cam.y)*cam.z + H/2});
const toWorld  = (sx,sy) => ({x:(sx-W/2)/cam.z + cam.x, y:(sy-H/2)/cam.z + cam.y});

// ---- force sim (alpha declared above, near the filters)
function tick(){
  if(alpha<0.02) return;
  const n=vis.length;
  for(let a=0;a<n;a++){
    const p=vis[a];
    // layer gravity
    const c=centers[p.L]||{x:0,y:0};
    p.vx += (c.x-p.x)*0.008; p.vy += (c.y-p.y)*0.008;
    p.vx += (0-p.x)*0.0008; p.vy += (0-p.y)*0.0008; // mild centering
  }
  // repulsion O(n^2) on visible
  for(let a=0;a<n;a++){
    const p=vis[a];
    for(let b=a+1;b<n;b++){
      const q=vis[b];
      let dx=p.x-q.x, dy=p.y-q.y; let d2=dx*dx+dy*dy; if(d2<0.01){dx=Math.random()-.5;dy=Math.random()-.5;d2=1;}
      if(d2>90000) continue;
      const f=1400/d2; const d=Math.sqrt(d2); const fx=dx/d*f, fy=dy/d*f;
      p.vx+=fx; p.vy+=fy; q.vx-=fx; q.vy-=fy;
    }
  }
  // springs on visible edges
  for(const e of G.edges){
    const p=G.nodes[e.s], q=G.nodes[e.t]; if(!p._vis||!q._vis) continue;
    let dx=q.x-p.x, dy=q.y-p.y; const d=Math.sqrt(dx*dx+dy*dy)||1;
    const ideal=e.y==='contains'||e.y==='exports'?46:120;
    const f=(d-ideal)*0.02; const fx=dx/d*f, fy=dy/d*f;
    p.vx+=fx; p.vy+=fy; q.vx-=fx; q.vy-=fy;
  }
  for(const p of vis){ if(p===dragNode) continue; p.vx*=0.82; p.vy*=0.82; p.x+=p.vx; p.y+=p.vy; }
  alpha*=0.985;
}

// ---- picking / hover / selection
let hover=null, selected=null, dragNode=null;
function radius(n){ return (n.fl?6:3.4) * (n.c==='complex'?1.5:n.c==='moderate'?1.2:1) + (n===selected?2:0); }
function matchesQuery(n){ if(!query) return true; const s=(n.name+' '+(n.path||'')+' '+n.tags.join(' ')).toLowerCase(); return s.includes(query); }

function draw(){
  G.nodes.forEach(n=> n._vis=false); vis.forEach(n=> n._vis=true);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.fillStyle=css('--canvas'); ctx.fillRect(0,0,W,H);
  // edges
  const hi = hover||selected;
  const hiSet = hi ? new Set([hi.i, ...hi.out.map(e=>e.t), ...hi.in.map(e=>e.s)]) : null;
  ctx.lineWidth=1;
  for(const e of G.edges){
    const p=G.nodes[e.s], q=G.nodes[e.t]; if(!p._vis||!q._vis) continue;
    const a=toScreen(p), b=toScreen(q);
    const on = hiSet ? (hiSet.has(e.s)&&hiSet.has(e.t) && (e.s===hi.i||e.t===hi.i)) : false;
    if(hiSet && !on){ ctx.strokeStyle = css('--line'); ctx.globalAlpha=.20; }
    else if(on){ ctx.strokeStyle=css('--accent'); ctx.globalAlpha=.85; ctx.lineWidth=1.6; }
    else { ctx.strokeStyle=layerColor(p.L); ctx.globalAlpha=.22; ctx.lineWidth=1; }
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.lineWidth=1;
  }
  ctx.globalAlpha=1;
  // nodes
  for(const n of vis){
    const p=toScreen(n); const r=radius(n)*Math.max(.8,Math.min(1.4,cam.z*1.1));
    const q = matchesQuery(n);
    const dim = (hiSet && !hiSet.has(n.i)) || !q;
    ctx.globalAlpha = dim?.28:1;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7);
    ctx.fillStyle=layerColor(n.L); ctx.fill();
    if(n===selected){ ctx.lineWidth=2.4; ctx.strokeStyle=css('--ink'); ctx.stroke(); }
    else if(n.fl){ ctx.lineWidth=1; ctx.strokeStyle=css('--panel'); ctx.stroke(); }
    // labels for file-level when zoomed or highlighted
    if((cam.z>1.05 && n.fl) || n===hover || n===selected || (hiSet&&hiSet.has(n.i)&&n.fl)){
      ctx.globalAlpha = dim?.4:1;
      ctx.fillStyle=css('--ink'); ctx.font='11px "Segoe UI",system-ui,sans-serif';
      ctx.fillText(n.name, p.x+r+3, p.y+3.5);
    }
  }
  ctx.globalAlpha=1;
}
function loop(){ tick(); draw(); requestAnimationFrame(loop); }
loop();

function pick(sx,sy){
  let best=null,bd=1e9;
  for(const n of vis){ const p=toScreen(n); const d=(p.x-sx)**2+(p.y-sy)**2; const r=radius(n)*Math.max(.8,cam.z*1.1)+4; if(d<r*r && d<bd){bd=d;best=n;} }
  return best;
}

// ---- interaction
let dragging=false, panning=false, last=null, moved=false;
cv.addEventListener('mousedown',ev=>{
  const sx=ev.offsetX, sy=ev.offsetY; last={x:sx,y:sy}; moved=false;
  const hit=pick(sx,sy);
  if(hit){ dragNode=hit; dragging=true; } else { panning=true; cv.classList.add('drag'); }
});
window.addEventListener('mousemove',ev=>{
  const rect=cv.getBoundingClientRect(); const sx=ev.clientX-rect.left, sy=ev.clientY-rect.top;
  if(dragging&&dragNode){ const w=toWorld(sx,sy); dragNode.x=w.x; dragNode.y=w.y; dragNode.vx=0; dragNode.vy=0; alpha=Math.max(alpha,.4); moved=true; }
  else if(panning&&last){ cam.x-=(sx-last.x)/cam.z; cam.y-=(sy-last.y)/cam.z; last={x:sx,y:sy}; moved=true; }
  else { const h=pick(sx,sy); if(h!==hover){hover=h; cv.style.cursor=h?'pointer':'grab';} }
});
window.addEventListener('mouseup',ev=>{
  if(dragging && !moved && dragNode) select(dragNode);
  else if(panning && !moved){ select(null); }
  dragging=panning=false; dragNode=null; last=null; cv.classList.remove('drag');
});
cv.addEventListener('wheel',ev=>{
  ev.preventDefault(); const rect=cv.getBoundingClientRect(); const sx=ev.clientX-rect.left, sy=ev.clientY-rect.top;
  const w=toWorld(sx,sy); const f=Math.exp(-ev.deltaY*0.0014); cam.z=Math.max(.18,Math.min(4,cam.z*f));
  const w2=toWorld(sx,sy); cam.x+=w.x-w2.x; cam.y+=w.y-w2.y;
},{passive:false});
document.getElementById('zin').onclick=()=>{cam.z=Math.min(4,cam.z*1.25)};
document.getElementById('zout').onclick=()=>{cam.z=Math.max(.18,cam.z/1.25)};
document.getElementById('zfit').onclick=()=>fit(vis);

function fit(list){
  if(!list.length) return;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const n of list){ minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x);maxy=Math.max(maxy,n.y); }
  const pad=80; cam.x=(minx+maxx)/2; cam.y=(miny+maxy)/2;
  cam.z=Math.max(.18,Math.min(2.4, Math.min(W/(maxx-minx+pad), H/(maxy-miny+pad))));
}

// ---- inspector
const insp=document.getElementById('inspector');
function typeLabel(t){return{file:'Arquivo',function:'Função',class:'Classe',config:'Config',document:'Documento',table:'Migration / Tabela'}[t]||t;}
function edgeLabel(y){return{imports:'importa',exports:'exporta',contains:'contém',configures:'configura',documents:'documenta',depends_on:'depende de',tested_by:'testado por',migrates:'migra'}[y]||y;}
function select(n){
  selected=n;
  if(!n){ insp.classList.remove('show'); return; }
  const lname=(G.layers.find(l=>l.id===n.L)||{}).name||'—';
  const badge=document.getElementById('insp-badge');
  badge.innerHTML='<span class="sw" style="background:'+layerColor(n.L)+'"></span>'+typeLabel(n.t)+' · '+lname;
  document.getElementById('insp-name').textContent=n.name;
  document.getElementById('insp-path').textContent=n.path||n.id;
  document.getElementById('insp-summary').textContent=n.s;
  document.getElementById('insp-tags').innerHTML=n.tags.map(t=>'<span class="tag">'+t+'</span>').join('');
  const conn=document.getElementById('insp-conn');
  const grp=(title, arr, dirKey)=>{
    if(!arr.length) return '';
    const items=arr.map(e=>{const other=G.nodes[dirKey==='out'?e.t:e.s]; return '<a data-i="'+other.i+'"><span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+layerColor(other.L)+';margin-right:6px"></span>'+other.name+' <span class="tp">'+edgeLabel(e.y)+'</span></a>';}).join('');
    return '<h4>'+title+' ('+arr.length+')</h4>'+items;
  };
  conn.innerHTML = grp('Sai de aqui →', n.out,'out') + grp('← Chega aqui', n.in,'in');
  conn.querySelectorAll('a').forEach(a=>{
    a.onclick=()=>{
      const t=G.nodes[+a.dataset.i];
      if(!t.fl && !show.fns){ show.fns=true; syncToggles(); }
      recompute();
      select(t); fit([t]);
    };
  });
  insp.classList.add('show');
}
document.getElementById('insp-close').onclick=()=>select(null);

// ---- header stats
document.getElementById('proj-desc').textContent = G.project.description;
const codeFiles = G.nodes.filter(n=>n.t==='file').length;
const stat=(b,s)=>'<div class="stat"><b>'+b+'</b><span>'+s+'</span></div>';
document.getElementById('stats').innerHTML =
  stat(G.nodes.length,'nós') + stat(G.edges.length,'arestas') +
  stat(G.layers.length,'camadas') + stat(codeFiles,'arquivos .ts') +
  stat(G.nodes.filter(n=>n.t==='table').length,'migrations');

// ---- legend
const legend=document.getElementById('legend');
G.layers.forEach(l=>{
  const el=document.createElement('div'); el.className='lg'; el.title=l.description;
  el.innerHTML='<span class="sw" style="background:'+layerColor(l.id)+'"></span><span class="nm">'+l.name+'</span><span class="ct">'+l.count+'</span>';
  el.onclick=()=>{ if(soloLayers.has(l.id)) soloLayers.delete(l.id); else soloLayers.add(l.id); syncLegend(); recompute(); };
  el._id=l.id; legend.appendChild(el);
});
function syncLegend(){
  document.getElementById('solo-hint').textContent = soloLayers.size? '· '+soloLayers.size+' isolada(s) — clique p/ limpar':'';
  [...legend.children].forEach(el=>{
    el.classList.toggle('solo', soloLayers.has(el._id));
    el.classList.toggle('off', soloLayers.size>0 && !soloLayers.has(el._id));
  });
}

// ---- toggles
const tgF=document.getElementById('tg-files'), tgN=document.getElementById('tg-fns');
function syncToggles(){ tgF.checked=show.files; tgN.checked=show.fns; }
tgF.onchange=()=>{show.files=tgF.checked; recompute();};
tgN.onchange=()=>{show.fns=tgN.checked; recompute();};

// ---- search
const sb=document.getElementById('search');
sb.oninput=()=>{ query=sb.value.trim().toLowerCase(); };
sb.onkeydown=(e)=>{ if(e.key==='Enter'){ const hit=vis.find(matchesQuery); if(hit){select(hit); fit([hit]);} } };

// ---- tour
const tourEl=document.getElementById('tour');
G.tour.forEach(step=>{
  const el=document.createElement('div'); el.className='ts';
  el.innerHTML='<div class="n"><span class="num">'+String(step.order).padStart(2,'0')+'</span><span class="tt">'+step.title+'</span></div><div class="ds">'+step.description+'</div>';
  el.onclick=()=>{
    [...tourEl.children].forEach(c=>c.classList.remove('open')); el.classList.add('open');
    const ns=step.idx.map(i=>G.nodes[i]);
    if(ns.some(n=>!n.fl)){ show.fns=true; syncToggles(); }
    recompute();
    if(ns.length){ selected=ns[0]; select(ns[0]); fit(ns); }
  };
  tourEl.appendChild(el);
});

// ---- theme reactivity (redraw picks up CSS vars automatically each frame)
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{});
setTimeout(()=>fit(vis),120);
</script>
</body>
